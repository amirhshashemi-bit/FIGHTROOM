name: Import optimized CC0 humanoid base rigs
on:
  push:
    branches: [arena-combat-foundation]
    paths:
      - ".github/workflows/import-quaternius-rigs.yml"
permissions:
  contents: write
jobs:
  import-rigs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-combat-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download pinned Quaternius-derived humanoid GLBs
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender/5821923af517ac5fdc82505faa92a0d575fc1b1a/test"
          curl --fail --location --retry 3 "$base/human_male.glb" -o /tmp/male-source.glb
          curl --fail --location --retry 3 "$base/human_female.glb" -o /tmp/female-source.glb
          ls -lh /tmp/*-source.glb
      - name: Install glTF optimization tools
        run: npm install --no-save @gltf-transform/core@4.2.1 @gltf-transform/extensions@4.2.1 @gltf-transform/functions@4.2.1 sharp@0.33.5 draco3dgltf@1.5.7
      - name: Strip unused animations and optimize geometry
        run: |
          cat > arena/optimize-rigs.mjs <<'EOF'
          import { NodeIO } from '@gltf-transform/core';
          import draco3d from 'draco3dgltf';
          import { ALL_EXTENSIONS } from '@gltf-transform/extensions';
          import { dedup, quantize, prune, textureCompress, draco } from '@gltf-transform/functions';
          import sharp from 'sharp';
          import fs from 'node:fs/promises';
          const encoder=await draco3d.createEncoderModule();
          const decoder=await draco3d.createDecoderModule();
          const io=new NodeIO().registerExtensions(ALL_EXTENSIONS).registerDependencies({'draco3d.encoder':encoder,'draco3d.decoder':decoder});
          for (const [src,dst] of [['/tmp/male-source.glb','arena/assets/models/quaternius-male.glb'],['/tmp/female-source.glb','arena/assets/models/quaternius-female.glb']]) {
            const doc=await io.read(src);
            const root=doc.getRoot();
            for (const animation of root.listAnimations()) animation.dispose();
            await doc.transform(dedup(),quantize(),prune(),textureCompress({encoder:sharp,targetFormat:'webp',resize:[512,512],quality:0.65,slots:/^(?!normalTexture).*$/}),draco({method:'edgebreaker'}));
            const skins=root.listSkins(),meshes=root.listMeshes();
            if(!skins.length||!meshes.length)throw new Error('Optimized model lost its skin or mesh: '+dst);
            const bytes=await io.writeBinary(doc);
            await fs.mkdir('arena/assets/models',{recursive:true});
            await fs.writeFile(dst,bytes);
            console.log(dst,'bytes=',bytes.byteLength,'skins=',skins.length,'meshes=',meshes.length,'animations=',root.listAnimations().length);
            if(root.listAnimations().length!==0)throw new Error('Unused source animations were not stripped');
          }
          EOF
          node arena/optimize-rigs.mjs
          sha256sum arena/assets/models/quaternius-*.glb > arena/assets/models/QUATERNIUS_RIG_SHA256SUMS
      - name: Write CC0 attribution and optimization manifest
        run: |
          cat > arena/assets/models/QUATERNIUS_RIGS_NOTICE.md <<'EOF'
          # Quaternius humanoid base rigs
          Original asset pack: Quaternius Universal Base Characters [Standard].
          License: CC0 1.0 Universal; commercial use permitted; attribution not required.
          Official source: https://quaternius.com/packs/universalbasecharacters.html
          Official download: https://quaternius.itch.io/universal-base-characters
          Source model files used here are prebuilt derivatives from the public repository:
          https://github.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender
          Pinned source commit: 5821923af517ac5fdc82505faa92a0d575fc1b1a
          Original source GLBs include 86 animation clips. FIGHTROOM removes those unused clips, preserves the humanoid mesh/skin, and applies geometry deduplication and quantization. Real ACCAD BVH clips are retargeted at runtime.
          Files: quaternius-male.glb and quaternius-female.glb.
          Checksums: QUATERNIUS_RIG_SHA256SUMS.
          EOF
      - name: Validate optimized rig assets
        run: |
          set -euo pipefail
          test -s arena/assets/models/quaternius-male.glb
          test -s arena/assets/models/quaternius-female.glb
          ls -lh arena/assets/models/quaternius-*.glb
      - name: Commit optimized humanoid rigs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arena/assets/models/quaternius-*.glb arena/assets/models/QUATERNIUS_RIG*
          if git diff --cached --quiet; then echo "No rig asset changes"; exit 0; fi
          git commit -m "Add optimized CC0 male and female humanoid rigs"
          git push origin HEAD:arena-combat-foundation
